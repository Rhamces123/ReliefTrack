<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Figure 13 - Admin Dashboard Flowchart</title>
  <style>
    body {

    h1 {
      margin-top: 0;
      font-size: 22px;
      color: #0f172a;
    }
    .badge {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    svg {
      width: 100%;
      min-width: 1750px;
      height: auto;
      max-height: 750px;
    }

</head>
<body>
  <div class="container">
    <span class="badge">Capstone Research Paper &bull; Figure 13</span>
    <h1>Admin Dashboard Flowchart</h1>
    <?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 700" width="1920" height="700" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <style>
    .flow-rect { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .flow-text { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .flow-edge { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
    .flow-edge-no-arrow { fill: none; stroke: #000000; stroke-width: 1.5; }
    .edge-label { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #000000; font-weight: normal; }
    .caption-text { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #000000; text-anchor: middle; font-weight: normal; }
  </style>

  <!-- Connectors / Edges -->
  <!-- Top Off-Page to Admin Dashboard box -->
  <path d="M 950 105 L 950 145" class="flow-edge" />

  <!-- Admin Dashboard to Horizontal Bus Line -->
  <path d="M 950 193 L 950 225" class="flow-edge-no-arrow" />
  <!-- Horizontal Bus Line across all 9 columns -->
  <path d="M 100 225 L 1800 225" class="flow-edge-no-arrow" />

  <!-- 9 Downward Drops to Columns -->
  <path d="M 100 225 L 100 265" class="flow-edge" />
  <path d="M 310 225 L 310 265" class="flow-edge" />
  <path d="M 520 225 L 520 265" class="flow-edge" />
  <path d="M 730 225 L 730 265" class="flow-edge" />
  <path d="M 950 225 L 950 265" class="flow-edge" />
  <path d="M 1170 225 L 1170 265" class="flow-edge" />
  <path d="M 1380 225 L 1380 265" class="flow-edge" />
  <path d="M 1590 225 L 1590 265" class="flow-edge" />
  <path d="M 1800 225 L 1800 265" class="flow-edge" />

  <!-- Col 1: Relief Requests to A -->
  <path d="M 100 313 L 100 365" class="flow-edge" />

  <!-- Col 2: Priority Assessment to B -->
  <path d="M 310 313 L 310 365" class="flow-edge" />

  <!-- Col 3: Inventory Management to C -->
  <path d="M 520 313 L 520 365" class="flow-edge" />

  <!-- Col 4: Beneficiaries to D -->
  <path d="M 730 313 L 730 365" class="flow-edge" />

  <!-- Col 5: Donations to E -->
  <path d="M 950 313 L 950 365" class="flow-edge" />

  <!-- Col 6: Map to Display Naga GIS Map -->
  <path d="M 1170 313 L 1170 365" class="flow-edge" />
  <!-- Map Feedback Loopback -->
  <path d="M 1245 389 L 1275 389 L 1275 289 L 1235 289" class="flow-edge" />

  <!-- Col 7: Reports & Analytics to F -->
  <path d="M 1380 313 L 1380 365" class="flow-edge" />

  <!-- Col 8: Auto Suggest to G -->
  <path d="M 1590 313 L 1590 365" class="flow-edge" />

  <!-- Col 9: Settings to Display Settings -->
  <path d="M 1800 313 L 1800 365" class="flow-edge" />
  <path d="M 1800 413 L 1800 460" class="flow-edge" />

  <!-- Col 9: Decision No Loopback (Right tip to Settings) -->
  <path d="M 1870 497.5 L 1895 497.5 L 1895 289 L 1865 289" class="flow-edge" />
  <text x="1875" y="488" class="edge-label">No</text>

  <!-- Col 9: Decision Yes (Left tip to Successfully saved) -->
  <path d="M 1730 497.5 L 1695 497.5" class="flow-edge" />
  <text x="1708" y="488" class="edge-label">Yes</text>

  <!-- Successfully saved to H -->
  <path d="M 1630 521.5 L 1630 570" class="flow-edge" />


  <!-- SHAPES & LABELS -->

  <!-- Top Off-Page Entry (Pentagon pointing down) -->
  <polygon points="905,40 995,40 995,85 950,105 905,85" class="flow-rect" />
  <text x="950" y="65" class="flow-text">
    <tspan x="950" dy="-6">Admin</tspan>
    <tspan x="950" dy="14">Dashboard</tspan>
  </text>

  <!-- Admin Dashboard Process Box -->
  <rect x="890" y="145" width="120" height="48" class="flow-rect" />
  <text x="950" y="169" class="flow-text">
    <tspan x="950" dy="-6">Admin</tspan>
    <tspan x="950" dy="14">Dashboard</tspan>
  </text>


  <!-- COL 1: Relief Requests -->
  <rect x="35" y="265" width="130" height="48" class="flow-rect" />
  <text x="100" y="289" class="flow-text">Relief Requests</text>

  <polygon points="75,365 125,365 125,402 100,420 75,402" class="flow-rect" />
  <text x="100" y="390" class="flow-text" style="font-weight: bold; font-size: 13px;">A</text>


  <!-- COL 2: Priority Assessment -->
  <rect x="245" y="265" width="130" height="48" class="flow-rect" />

  <polygon points="285,365 335,365 335,402 310,420 285,402" class="flow-rect" />
  <text x="310" y="390" class="flow-text" style="font-weight: bold; font-size: 13px;">B</text>


  <!-- COL 3: Inventory Management -->
  <rect x="455" y="265" width="130" height="48" class="flow-rect" />
  <text x="520" y="289" class="flow-text">
    <tspan x="520" dy="-6">Inventory</tspan>
    <tspan x="520" dy="14">Management</tspan>
  </text>

  <polygon points="495,365 545,365 545,402 520,420 495,402" class="flow-rect" />
  <text x="520" y="390" class="flow-text" style="font-weight: bold; font-size: 13px;">C</text>


  <!-- COL 4: Beneficiaries -->
  <rect x="665" y="265" width="130" height="48" class="flow-rect" />
  <text x="730" y="289" class="flow-text">Beneficiaries</text>

  <polygon points="705,365 755,365 755,402 730,420 705,402" class="flow-rect" />
  <text x="730" y="390" class="flow-text" style="font-weight: bold; font-size: 13px;">D</text>


  <!-- COL 5: Donations -->
  <rect x="885" y="265" width="130" height="48" class="flow-rect" />
  <text x="950" y="289" class="flow-text">Donations</text>

  <polygon points="925,365 975,365 975,402 950,420 925,402" class="flow-rect" />
  <text x="950" y="390" class="flow-text" style="font-weight: bold; font-size: 13px;">E</text>


  <!-- COL 6: Map (Exact Fig 13 Col 4 pattern) -->
  <rect x="1105" y="265" width="130" height="48" class="flow-rect" />
  <text x="1170" y="289" class="flow-text">Map</text>

  <polygon points="1110,365 1245,365 1230,413 1095,413" class="flow-rect" />
  <text x="1170" y="389" class="flow-text">
    <tspan x="1170" dy="-6">Display Naga</tspan>
    <tspan x="1170" dy="14">GIS Map</tspan>
  </text>


  <!-- COL 7: Reports & Analytics -->
  <rect x="1315" y="265" width="130" height="48" class="flow-rect" />
  <text x="1380" y="289" class="flow-text">
    <tspan x="1380" dy="-6">Reports &amp;</tspan>
    <tspan x="1380" dy="14">Analytics</tspan>

  <polygon points="1355,365 1405,365 1405,402 1380,420 1355,402" class="flow-rect" />

  <!-- COL 8: Auto Suggest -->
  <rect x="1525" y="265" width="130" height="48" class="flow-rect" />

  <polygon points="1565,365 1615,365 1615,402 1590,420 1565,402" class="flow-rect" />
  <text x="1590" y="390" class="flow-text" style="font-weight: bold; font-size: 13px;">G</text>


  <!-- COL 9: Settings (Exact Fig 13 Col 5 pattern) -->
  <rect x="1735" y="265" width="130" height="48" class="flow-rect" />
  <text x="1800" y="289" class="flow-text">Settings</text>

  <polygon points="1745,365 1870,365 1855,413 1730,413" class="flow-rect" />
  <text x="1800" y="389" class="flow-text">Display Settings</text>

  <polygon points="1800,460 1870,497.5 1800,535 1730,497.5" class="flow-rect" />
  <text x="1800" y="497.5" class="flow-text" style="font-size: 10px;">
    <tspan x="1800" dy="-5">Save settings</tspan>
    <tspan x="1800" dy="12">changes?</tspan>
  </text>

  <!-- Successfully saved (Left of Diamond) -->
  <polygon points="1580,473.5 1695,473.5 1680,521.5 1565,521.5" class="flow-rect" />
  <text x="1630" y="497.5" class="flow-text">
    <tspan x="1630" dy="-6">Successfully</tspan>
    <tspan x="1630" dy="14">saved</tspan>
  </text>

  <polygon points="1605,570 1655,570 1655,607 1630,625 1605,607" class="flow-rect" />
  <text x="1630" y="595" class="flow-text" style="font-weight: bold; font-size: 13px;">H</text>


  <!-- Caption -->
  <text x="950" y="660" class="caption-text">Figure 13</text>
</svg>

  </div>
</body>
</html>
